[project]
name = "llm-snd"
version = "0.1.0"
description = "Multi-agent heuristic coevolution with Bayesian active complementary search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.101.0",
    "marimo>=0.24.2",
    "matplotlib>=3.9",
    "numpy>=2.5.3",
    "scipy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-subtests>=0.14"]

[tool.setuptools.package-data]
"eoh" = ["operator_prompts.txt"]
